<title>Bailando Terrace Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#0B0D13; --panel:#151925; --panel2:#1C2233; --raise:#232A3D;
  --line:#252C3F; --line2:#333C55;
  --text:#E9E6DF; --muted:#8B93A9; --dim:#5C657C;
  --rosa:#FF5C7A; --rosa-dim:#7d2f42; --cyan:#57C7E8; --brass:#D9A441;
  --ok:#4CC38A; --warn:#F3B03C; --bad:#FF5566;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,monospace;
  --r:7px;
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:13.5px;line-height:1.5;
     -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-columns:286px 1fr 330px;grid-template-rows:auto 1fr auto;
     height:100vh;height:100dvh;gap:1px;background:var(--line)}

/* ---------- top bar ---------- */
#topbar{grid-column:1/-1;background:var(--panel);display:flex;align-items:center;gap:18px;
        padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;padding-right:16px;border-right:1px solid var(--line);margin-right:2px}
.brand h1{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;margin:0;
          background:linear-gradient(96deg,var(--rosa),var(--brass));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .sub{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}

.field{display:flex;align-items:center;gap:6px}
.field label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
input[type=number],input[type=text],select{background:var(--ink);border:1px solid var(--line2);border-radius:var(--r);
  padding:5px 7px;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;width:68px}
select{width:auto;font-family:var(--sans);font-size:12.5px;padding-right:22px}
input[type=text]{font-family:var(--sans);width:100%}
input:hover,select:hover{border-color:var(--dim)}

.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);padding:6px 11px;
     cursor:pointer;white-space:nowrap;transition:background .13s,border-color .13s,color .13s;font-size:12.5px}
.btn:hover{background:var(--raise);border-color:var(--dim)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--rosa);border-color:var(--rosa);color:#210711;font-weight:600}
.btn.primary:hover{background:#ff7690}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.spacer{flex:1}

.seg{display:flex;background:var(--ink);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:12.5px;
            border-right:1px solid var(--line);transition:color .13s,background .13s}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--text);background:var(--panel2)}
.seg button[aria-pressed=true]{background:var(--rosa);color:#210711;font-weight:600}
.seg.cool button[aria-pressed=true]{background:var(--cyan);color:#04222c}

/* ---------- rails ---------- */
aside{background:var(--panel);overflow-y:auto;overflow-x:hidden}
.railhead{position:sticky;top:0;z-index:3;background:var(--panel);padding:12px 14px 9px;border-bottom:1px solid var(--line)}
.railhead h2{font-family:var(--display);font-weight:600;font-size:14px;margin:0 0 3px;letter-spacing:-.01em}
.railhead p{margin:0;font-size:11.5px;color:var(--dim)}
#search{width:100%;margin-top:9px;font-family:var(--sans)}

.grouphead{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--brass);
           padding:15px 14px 6px;font-weight:600}
.pick{display:block;width:100%;text-align:left;background:transparent;border:0;border-left:2px solid transparent;
      padding:7px 14px;cursor:pointer;transition:background .12s,border-color .12s}
.pick:hover{background:var(--panel2);border-left-color:var(--rosa)}
.pick .nm{display:block;font-size:12.8px}
.pick .dm{display:block;font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:1px}

/* ---------- stage ---------- */
#stage{position:relative;background:#05070d;overflow:hidden}
#view,#ovl{position:absolute;inset:0;width:100%;height:100%;display:block}
#ovl{pointer-events:none}
#view{touch-action:none;cursor:grab}
#view.dragging{cursor:grabbing}
#view.walking{cursor:crosshair}

.hud{position:absolute;display:flex;gap:8px;align-items:center;z-index:2}
.hud.tl{top:12px;left:12px}
.hud.tr{top:12px;right:12px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 24px)}
.hud.bl{bottom:12px;left:12px;max-width:min(560px,calc(100% - 24px))}
.chip{background:rgba(13,16,25,.86);backdrop-filter:blur(9px);border:1px solid var(--line2);
      border-radius:var(--r);padding:6px 11px;font-size:12px;color:var(--muted)}
.chip b{color:var(--text);font-weight:600}
.chip kbd{font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--line2);
          border-radius:4px;padding:0 4px;color:var(--text);margin:0 1px}
.hud .seg,.hud .btn{background:rgba(13,16,25,.86);backdrop-filter:blur(9px)}
.toggle{display:flex;align-items:center;gap:6px;background:rgba(13,16,25,.86);backdrop-filter:blur(9px);
        border:1px solid var(--line2);border-radius:var(--r);padding:5px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.toggle input{accent-color:var(--cyan);margin:0}
.toggle[data-on=true]{color:var(--text);border-color:var(--cyan)}

/* ---------- inspector ---------- */
.sect{padding:13px 15px;border-bottom:1px solid var(--line)}
.sect h3{font-family:var(--display);font-weight:600;font-size:13.5px;margin:0 0 2px;letter-spacing:-.01em}
.sect .spec{font-family:var(--mono);font-size:11.5px;color:var(--cyan);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:9px 0 0;padding-left:9px;border-left:2px solid var(--brass)}
.rowgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.rowgrid .field{flex-direction:column;align-items:stretch;gap:3px}
.rowgrid input,.rowgrid select{width:100%}
.empty{padding:26px 16px;color:var(--dim);font-size:12.5px}
.empty b{display:block;color:var(--muted);font-family:var(--display);font-size:14px;margin-bottom:7px}
.empty ul{margin:9px 0 0;padding-left:16px;line-height:1.75}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.stat{background:var(--panel);padding:9px 14px}
.stat .v{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:1px}
.stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)} .stat .v.bad{color:var(--bad)}

.issue{display:flex;gap:9px;padding:9px 15px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.2px;
       background:transparent;border-left:2px solid transparent;width:100%;text-align:left;transition:background .12s}
.issue:hover{background:var(--panel2)}
.issue .dot{flex:0 0 7px;height:7px;border-radius:50%;margin-top:6px}
.issue.clash{border-left-color:var(--bad)} .issue.clash .dot{background:var(--bad)}
.issue.tight{border-left-color:var(--warn)} .issue.tight .dot{background:var(--warn)}
.allclear{padding:15px;color:var(--ok);font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
.allclear .dot{flex:0 0 7px;height:7px;border-radius:50%;background:var(--ok);margin-top:6px}

/* ---------- status ---------- */
#status{grid-column:1/-1;background:var(--panel);padding:6px 16px;display:flex;gap:18px;align-items:center;
        font-family:var(--mono);font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;flex-wrap:wrap}
#status b{color:var(--muted);font-weight:500}
#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--raise);
       border:1px solid var(--line2);border-radius:var(--r);padding:9px 16px;font-size:12.5px;opacity:0;
       transition:opacity .2s,transform .2s;pointer-events:none;z-index:40;max-width:min(90vw,520px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#railBtn,#inspBtn{display:none}
@media (max-width:1180px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;top:0;bottom:0;width:300px;z-index:20;transition:transform .22s;border-right:1px solid var(--line)}
  #rail{left:0;transform:translateX(-101%)} #rail.open{transform:none}
  #inspect{right:0;left:auto;transform:translateX(101%);border-right:0;border-left:1px solid var(--line)}
  #inspect.open{transform:none}
  #railBtn,#inspBtn{display:inline-block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header id="topbar">
    <div class="brand">
      <h1>Bailando</h1>
      <span class="sub">8th floor · terrace by Bailamos</span>
    </div>
    <button class="btn" id="railBtn">Catalogue</button>
    <div class="field"><label for="rw">Terrace</label>
      <input type="number" id="rw" step="0.1" min="3" max="60"> <span style="color:var(--dim)">×</span>
      <input type="number" id="rd" step="0.1" min="3" max="60"> <span style="color:var(--dim);font-size:11.5px">m</span>
    </div>
    <div class="field"><label for="rp">Parapet</label><input type="number" id="rp" step="0.05" min="0" max="2" style="width:58px"></div>
    <div class="field"><label for="rf">Floor</label><select id="rf"></select></div>
    <div class="spacer"></div>
    <button class="btn ghost" id="undo" title="Ctrl+Z">Undo</button>
    <select id="presets" title="Starting layouts"></select>
    <button class="btn" id="snap">Snapshot</button>
    <button class="btn" id="exp">Export</button>
    <button class="btn ghost" id="imp">Import</button>
    <button class="btn" id="inspBtn">Details</button>
  </header>

  <aside id="rail">
    <div class="railhead">
      <h2>Catalogue</h2>
      <p>Real ordering sizes. Click to drop one in.</p>
      <input type="text" id="search" placeholder="Search — pool, sofa, PS5…">
    </div>
    <div id="picks"></div>
  </aside>

  <main id="stage">
    <canvas id="view"></canvas>
    <svg id="ovl" aria-hidden="true"></svg>
    <div class="hud tl">
      <div class="seg" id="viewSeg">
        <button data-v="plan">Plan</button><button data-v="orbit">3D</button><button data-v="walk">Walk</button>
      </div>
    </div>
    <div class="hud tr">
      <div class="seg cool" id="moodSeg"></div>
      <label class="toggle" id="clearTog"><input type="checkbox" id="showClear" checked> Clearances</label>
      <label class="toggle" id="labelTog"><input type="checkbox" id="showLabels" checked> Labels</label>
    </div>
    <div class="hud bl"><div class="chip" id="hint"></div></div>
  </main>

  <aside id="inspect">
    <div id="insp"></div>
    <div class="railhead" style="border-top:1px solid var(--line)"><h2>Fit check</h2><p>Live, against real clearances.</p></div>
    <div class="stats" id="stats"></div>
    <div id="issues"></div>
  </aside>

  <footer id="status"></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileImg" accept="image/*,video/*" hidden>
<input type="file" id="fileJson" accept="application/json,.json" hidden>
